[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "naartjie-cv-trainer"
version = "0.1.0"
description = "Synthetic-data and YOLO26 training pipeline for naartjie defect instance segmentation."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

