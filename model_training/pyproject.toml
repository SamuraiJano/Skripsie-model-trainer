[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skripsie-model-trainer"
version = "2.0.0"
description = "YOLO/D-FINE training plus paired Ghost-DeblurGAN training and safety evaluation."
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics==8.4.95",
    "PyYAML==6.0.3",
    "numpy==2.3.5",
    "opencv-python==5.0.0.93",
    "Pillow>=10.0",
    "torch>=2.5,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4",
    "ipywidgets>=8.1",
]
tensorrt = [
    "tensorrt-cu13==11.2.1.2",
    "nvidia-modelopt[onnx]>=0.44",
]
dfine = [
    "torchvision>=0.15.2",
    "faster-coco-eval>=1.6.6",
    "tensorboard>=2.20",
    "scipy",
    "calflops>=0.3.2",
    "transformers>=4.40",
    "loguru>=0.7",
]
dfine-seg = [
    "torchvision>=0.20,<1",
    "albumentations==2.0.8",
    "faster-coco-eval>=1.6.5",
    "huggingface-hub>=0.30",
    "hydra-core==1.3.2",
    "loguru>=0.7",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "scipy>=1.14",
    "tabulate>=0.9",
    "torchmetrics==1.9.0",
    "tqdm>=4.66",
    "wandb==0.26.1",
]
deblur-export = [
    "torchvision>=0.20",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "lpips>=0.1.4",
]
test = ["pytest>=8.0"]

[tool.setuptools]
packages = ["naartjie_cv", "deblur"]
package-dir = {naartjie_cv = "src/naartjie_cv", deblur = "deblur"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
