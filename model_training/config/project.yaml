project:
  name: naartjie-yolo26
  seed: 42

paths:
  foreground_dir: data/raw/foreground
  background_dir: data/raw/background
  synthetic_dir: data/synthetic/rgb
  synthetic_multispectral_dir: data/synthetic/rgb_hsv
  runs_dir: runs
  exports_dir: exports

classes:
  0: class_1
  1: class_2
  2: class_3

synthetic:
  total_images: 10000
  split:
    train: 0.8
    val: 0.1
    test: 0.1
  image_ext: .jpg
  jpeg_quality: 95
  target_size: [1920, 1080]
  instances_per_image: [1, 1]
  defect_scale_range: [0.035, 0.18]
  rotation_degrees: [-35, 35]
  opacity_range: [0.72, 1.0]
  blur_probability: 0.25
  blur_kernel_choices: [3, 5]
  color_jitter:
    brightness: [0.85, 1.15]
    saturation: [0.80, 1.25]
    hue_degrees: [-6, 6]
  fruit_mask:
    hsv_lower: [4, 35, 35]
    hsv_upper: [38, 255, 255]
    min_area_fraction: 0.05
    fallback: ellipse

training:
  model_rgb: yolo26n-seg.pt
  model_rgb_hsv: yolo26n-seg.pt
  epochs: 100
  imgsz: 736
  batch: -1
  workers: 8
  device: 0
  patience: 30
  save_period: 5
  amp: true
  cos_lr: true
  resume: true
  optimizer: auto
  plots: true
  hsv_h: 0.015
  hsv_s: 0.70
  hsv_v: 0.40

evaluation:
  conf: 0.25
  iou: 0.50
  max_det: 100
  splits: [val, test]

classical_baselines:
  enabled: true
  input_size: [1280, 720]
  min_contour_area: 80
  morphology_kernel: 5
  fruit_mask:
    hsv_lower: [4, 35, 35]
    hsv_upper: [38, 255, 255]
    min_area_fraction: 0.05
    fallback: ellipse
  hsv_thresholding:
    class_ranges:
      class_1:
        - lower: [0, 35, 20]
          upper: [18, 255, 230]
      class_2:
        - lower: [35, 35, 20]
          upper: [95, 255, 255]
      class_3:
        - lower: [96, 15, 15]
          upper: [179, 255, 230]
  lab_kmeans:
    n_clusters: 4
    sample_pixels: 25000
    random_state: 42
    defect_distance_threshold: 18.0
    max_cluster_fraction: 0.45
  defect_classifier:
    classifier: svm
    min_confidence: 0.45
    max_train_samples_per_class: 1200
    negative_samples_per_image: 3
    candidate_method: hsv_and_lab
    knn:
      n_neighbors: 5
      weights: distance
    svm:
      c: 3.0
      gamma: scale
      kernel: rbf

export:
  format: ncnn
  half: false
  int8: true
  simplify: true
  imgsz: 640

inference:
  source_size: [640, 480]
  conf: 0.25
  iou: 0.50

fiftyone:
  dataset_prefix: naartjie_defects
  label_field: ground_truth
  prediction_field: predictions
  eval_key: eval
  label_types: segmentations
  launch_port: 5151
  hard_examples:
    max_samples: 250
    min_false_positives: 1
    min_false_negatives: 1
    export_dir: data/curation/fiftyone_hard_examples
